# 推到 main 就自动构建并发布到 GitHub Pages。
# 手动重跑：仓库 Actions 页面 → 选这个 workflow → Run workflow。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 发布到 Pages 需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一次发布，后来的排队而不是打架
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 测试不过就不发布 —— 别把坏版本推到线上
      - run: npm test
      - run: npm run build
        env:
          # 访问统计的地址（D99）。取值顺序：
          #   1. 仓库变量 GOATCOUNTER（Settings → Secrets and variables → Actions → Variables）——
          #      设了就用它，随时能改、能清空，不必动代码；
          #   2. 没设的话，**只有本仓库**回落到下面这个默认值。
          # 为什么要带 `github.repository ==` 这道判断：别人 fork 去自己部署时，
          # 不该把他的访问量记到原作者的后台里（这条理由本来就写在 src/analytics.js 的文件头）。
          # 地址本身不是秘密 —— 它最终会出现在发布出去的页面里，所以放变量还是放这里都无所谓，
          # 差别只在"改它要不要动代码"。
          VITE_GOATCOUNTER: ${{ vars.GOATCOUNTER || (github.repository == 'geesonchan/game-of-life' && 'https://geesonchan.goatcounter.com/count' || '') }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
